<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoFit screenshot composition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:430px;height:932px;overflow:hidden;background:#101111;color:#faf8f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.canvas{position:relative;width:430px;height:932px;background:radial-gradient(ellipse at 85% 40%,#4a3b193d,transparent 58%),linear-gradient(155deg,#20201e,#0c0d0e 70%);padding:26px 28px 0;text-align:center}
.brand{font-size:10px;letter-spacing:3.3px;font-weight:700;color:#d9b44a;direction:ltr;display:flex;align-items:center;justify-content:center;gap:9px}.brand img{width:20px;height:20px;border-radius:5px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.5px;color:#d5c9ab;margin:15px 0 8px}h1{font-size:34px;line-height:1.13;letter-spacing:-.8px;font-weight:750;margin:0;white-space:pre-line}p.caption{font-size:11px;color:#c8c4ba;margin:12px 0 0;white-space:nowrap}
.phone{position:absolute;width:328px;height:696px;top:222px;left:51px;padding:5px;border:1px solid #666054;border-radius:30px;background:#1d1d1d;box-shadow:0 22px 50px #000b;overflow:hidden}
.phone img{width:316px;height:auto;display:block;border-radius:24px}
.line{position:absolute;inset:auto 0 0;height:150px;pointer-events:none;background:linear-gradient(transparent,#0b0c0c35)}
html[data-native-family="iphone"],html[data-native-family="iphone"] body,html[data-native-family="iphone"] .canvas{width:440px;height:956px}
html[data-native-family="iphone"] .phone{width:338px;height:720px}
html[data-native-family="iphone"] .phone img{width:326px}
html[data-native-family="ipad"],html[data-native-family="ipad"] body,html[data-native-family="ipad"] .canvas{width:1032px;height:1376px}
html[data-native-family="ipad"] .canvas{padding:40px 60px 0}
html[data-native-family="ipad"] .brand{font-size:22px}
html[data-native-family="ipad"] .brand img{width:40px;height:40px}
html[data-native-family="ipad"] .eyebrow{font-size:20px;margin:24px 0 12px}
html[data-native-family="ipad"] h1{font-size:68px}
html[data-native-family="ipad"] p.caption{font-size:24px;margin-top:18px}
html[data-native-family="ipad"] .phone{width:668px;height:902px;top:450px;left:182px}
html[data-native-family="ipad"] .phone img{width:656px}
</style>
<div class="canvas"><div class="brand"><img src="/icon.png" alt="">AUTOFIT</div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="caption" id="caption"></p><div class="phone"><img id="screen" alt=""></div><div class="line"></div></div>
<script>
const params = new URLSearchParams(location.search), lang = params.get('lang') === 'en' ? 'en' : 'he';
document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
fetch('/listing.json').then(r=>r.json()).then(data=>{
 const item = data.locales[lang].screens.find(s=>s.id===params.get('screen'));
 if(!item) throw new Error('Unknown screen');
 const native = params.get('source') === 'native', family = params.get('family');
 if(native) {
  if(!['iphone','ipad'].includes(family) || !data.nativePreview?.families.includes(family)) throw new Error('Native family unavailable');
  document.documentElement.dataset.nativeFamily=family;
 }
 for(const field of ['eyebrow','title','caption']) document.getElementById(field).textContent=item[field];
 document.getElementById('screen').src=native ? `/assets/native/${family}-${lang}-${item.id}.png` : `/assets/raw-${lang}-${item.id}.png`;
 document.getElementById('screen').alt=item.alt;
 document.documentElement.dataset.ready='true';
}).catch(error=>{document.body.textContent=error.message;});
</script></html>
