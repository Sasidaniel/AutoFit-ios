name: iOS audio validation (no release)

on:
  workflow_dispatch:
    inputs:
      widget_only:
        description: 'Measure only the production SwiftUI views; no app build or release'
        type: boolean
        default: false
      store_screenshots:
        description: 'Capture the actual app in iPhone and iPad simulators with synthetic data; no release'
        type: boolean
        default: false
      store_device:
        description: 'Device family to capture; select one to recover a partial capture without repeating the other'
        type: choice
        options: [all, iphone, ipad]
        default: all
  push:
    paths:
      - '.github/workflows/ios-audio-validation.yml'

permissions:
  contents: read

jobs:
  widget-layout:
    if: (github.event_name == 'workflow_dispatch' && inputs.widget_only) || contains(github.event.head_commit.message, '[validate-widget]')
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Measure all 144 production widget layouts without building or releasing the app
        run: bash .github/scripts/test-widget-layout.sh
      - name: Preserve measurements and rendered views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-layout
          path: |
            ${{ runner.temp }}/widget-layout*.png
            ${{ runner.temp }}/layout-measurements.txt
            ${{ runner.temp }}/layout-result.txt
            ${{ runner.temp }}/widget-layout.log
          retention-days: 3
  validate:
    if: (github.event_name == 'workflow_dispatch' && !inputs.widget_only && !inputs.store_screenshots) || contains(github.event.head_commit.message, '[validate-audio]')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm ci
      - name: Run JavaScript regressions
        run: npm test
      - name: Sync iOS dependencies
        run: npx cap sync ios
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Test native speech buffer and audio policies
        run: |
          set -e
          swiftc ios/App/App/SpeechUtteranceBuffer.swift tests/SpeechUtteranceBufferTests.swift -o "$RUNNER_TEMP/speech-tests"
          "$RUNNER_TEMP/speech-tests"
          swiftc ios/App/App/WorkoutAudioPolicy.swift tests/WorkoutAudioPolicyTests.swift -o "$RUNNER_TEMP/audio-tests"
          "$RUNNER_TEMP/audio-tests"
          swiftc -D ACTIVITY_STATE_TEST ios/App/App/WorkoutActivityAttributes.swift tests/WorkoutActivityStateTests.swift -o "$RUNNER_TEMP/activity-tests"
          "$RUNNER_TEMP/activity-tests"
          swiftc ios/App/App/ScheduledWorkoutAnnouncement.swift tests/ScheduledWorkoutAnnouncementTests.swift -o "$RUNNER_TEMP/announcement-tests"
          "$RUNNER_TEMP/announcement-tests"
      - name: Test real Swift transcript stream through the JavaScript workout controller
        run: |
          set -e
          "$RUNNER_TEMP/speech-tests" --count-stream > "$RUNNER_TEMP/count-stream.json"
          "$RUNNER_TEMP/speech-tests" --hebrew-count-stream > "$RUNNER_TEMP/hebrew-count-stream.json"
          AUTOFIT_NATIVE_COUNT_STREAM="$RUNNER_TEMP/count-stream.json" AUTOFIT_NATIVE_HEBREW_COUNT_STREAM="$RUNNER_TEMP/hebrew-count-stream.json" node --test --test-name-pattern="native.*streaming contract" tests/native-regressions.test.cjs
      - name: Compile app and widget for simulator without signing or distribution
        run: |
          set -e
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/AudioValidation" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/audio-build.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/audio-build.log"
              exit 1
            }
      - name: Measure all 144 production widget layouts in iPhone Simulator
        timeout-minutes: 10
        run: bash .github/scripts/test-widget-layout.sh
      - name: Preserve measured widget rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-layout
          path: |
            ${{ runner.temp }}/widget-layout*.png
            ${{ runner.temp }}/layout-measurements.txt
            ${{ runner.temp }}/layout-result.txt
            ${{ runner.temp }}/audio-build.log
            ${{ runner.temp }}/widget-layout.log
          retention-days: 3
  store-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.store_screenshots && !inputs.widget_only
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/app-store-native-capture.test.cjs
      - run: npm ci
      - run: npx cap sync ios
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Prime verified Capacitor binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="$(node -p "require('./node_modules/@capacitor/ios/package.json').version")"
          DOWNLOAD="$RUNNER_TEMP/capacitor-binaries"
          mkdir -p "$DOWNLOAD"
          gh api "repos/ionic-team/capacitor-swift-pm/releases/tags/$VERSION" --jq '{tag_name,assets:[.assets[]|{name,browser_download_url,digest}]}' > "$DOWNLOAD/release.json"
          gh release download "$VERSION" --repo ionic-team/capacitor-swift-pm --pattern Capacitor.xcframework.zip --pattern Cordova.xcframework.zip --dir "$DOWNLOAD"
          node .github/scripts/prime-capacitor-cache.cjs "$VERSION" "$DOWNLOAD" "$RUNNER_TEMP/swift-package-cache/artifacts"
      - name: Capture actual iPhone and iPad app screens
        env:
          CAPTURE_DEVICE_FAMILY: ${{ inputs.store_device || 'all' }}
        run: bash .github/scripts/capture-store-simulator.sh
      - name: Preserve native captures and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-store-captures
          path: ${{ runner.temp }}/native-store-captures
          if-no-files-found: error
          retention-days: 14
