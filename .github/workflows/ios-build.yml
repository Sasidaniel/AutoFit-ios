name: iOS Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional unused Apple build number for retrying a failed release'
        required: false
        type: string
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15-intel
    env:
      APP_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Test speech utterance boundaries
        run: |
          swiftc ios/App/App/SpeechUtteranceBuffer.swift tests/SpeechUtteranceBufferTests.swift -o "$RUNNER_TEMP/speech-tests"
          "$RUNNER_TEMP/speech-tests"

      - name: Test native numeric stream through workout controller
        run: |
          set -e
          "$RUNNER_TEMP/speech-tests" --count-stream > "$RUNNER_TEMP/count-stream.json"
          AUTOFIT_NATIVE_COUNT_STREAM="$RUNNER_TEMP/count-stream.json" node --test --test-name-pattern="native streaming contract" tests/native-regressions.test.cjs

      - name: Test workout Live Activity state
        run: |
          swiftc -D ACTIVITY_STATE_TEST ios/App/App/WorkoutActivityAttributes.swift tests/WorkoutActivityStateTests.swift -o "$RUNNER_TEMP/activity-tests"
          "$RUNNER_TEMP/activity-tests"

      - name: Test native announcement deadlines
        run: |
          swiftc ios/App/App/ScheduledWorkoutAnnouncement.swift tests/ScheduledWorkoutAnnouncementTests.swift -o "$RUNNER_TEMP/announcement-tests"
          "$RUNNER_TEMP/announcement-tests"

      - name: Test music-safe audio policy
        run: |
          swiftc ios/App/App/WorkoutAudioPolicy.swift tests/WorkoutAudioPolicyTests.swift -o "$RUNNER_TEMP/audio-policy-tests"
          "$RUNNER_TEMP/audio-policy-tests"

      - name: Measure real widget layouts in iPhone Simulator
        timeout-minutes: 10
        run: bash .github/scripts/test-widget-layout.sh

      - name: Import signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_LIVE_ACTIVITY_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Decode cert + profile from the base64 secrets
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          test -n "$IOS_LIVE_ACTIVITY_PROFILE_BASE64"
          echo "$IOS_LIVE_ACTIVITY_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/activity.mobileprovision"

          # Create a fresh, throwaway keychain for this run only
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # Install the provisioning profile where Xcode expects it, named by its own UUID
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          for PROFILE in "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/activity.mobileprovision"; do
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
            cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
            echo "Installed provisioning profile UUID: $UUID"
          done

      - name: Archive app
        run: |
          set -e
          [[ "$APP_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid Apple build number"; exit 1; }
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER"

      - name: Export .ipa
        run: |
          set -e
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sasidaniel.autofit</key>
              <string>AutoFit AppStore</string>
              <key>com.sasidaniel.autofit.liveactivity</key>
              <string>AutoFit Live Activity AppStore</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Verify Apple processing and internal TestFlight availability
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: node .github/scripts/verify-testflight.cjs

      - name: Upload build artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            ${{ runner.temp }}/export
            ${{ runner.temp }}/widget-layout*.png
          retention-days: 5
