name: Verify existing internal TestFlight build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Existing approved Apple build number. Does not build or upload another binary.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-verification-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved release configuration
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test internal delivery verification
        run: node --test --test-name-pattern='release verifier|internal delivery' tests/native-regressions.test.cjs
      - name: Complete and verify existing internal distribution
        env:
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: node .github/scripts/verify-testflight.cjs
